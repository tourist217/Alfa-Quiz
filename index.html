:root{
  color-scheme: light;
  --font-display: "YFF Rare", -apple-system, sans-serif;
  --font-body: "YFF Rare", -apple-system, sans-serif;

  /* Базовая палитра брендбука Альфа Селлер 2026 */
  --lime: #A6ED00;          /* Ярко-зеленый (акцентный) */
  --lime-hover: #96D700;
  --on-lime: #000000;       /* Чистый черный */
  --white: #FFFFFF;         /* Чистый белый */
  --smoky: #E9EBEE;         /* Дымчато-белый */
  --graphite: #121212;      /* Глубокий графит */
  --red: #DC200C;           /* Тициановый (красный акцент) */
  --black: #000000;

  /* Семантические переменные */
  --bg: #F4F5F7;
  --paper: #FFFFFF;
  --panel: #E9EBEE;         /* Дымчато-белый для карточек/кнопок */
  --panel-hover: #DFE2E7;
  --text: #000000;          /* Чистый черный */
  --muted: #5D5F6B;
  --bar: #121212;           /* Глубокий графит */
  --on-bar: #FFFFFF;
  --field: #F2F4F7;
  --border: #D2D5DC;
  --focus: #121212;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg: #000000;           /* Чистый черный */
    --paper: #121212;        /* Глубокий графит */
    --panel: #1A1A1A;
    --panel-hover: #242424;
    --text: #FFFFFF;         /* Чистый белый */
    --muted: #A0A4AB;        /* Дымчатый */
    --bar: #000000;          /* Чистый черный */
    --on-bar: #FFFFFF;
    --field: #181818;
    --border: #262626;
    --focus: #A6ED00;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);
  font-variation-settings: 'wdth' 87, 'wght' 400; /* Брендбук Альфа-Селлер: YFF Rare Hyper Regular (Наборный текст) */
  font-size:18px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
b,strong,th,.field label,.hero-facts li,.why li{
  font-variation-settings: 'wdth' 87, 'wght' 700; /* YFF Rare Hyper Bold */
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.shell{
  max-width:1120px;margin:0 auto;
  padding:clamp(12px,2.4vw,24px) clamp(12px,2.6vw,28px) clamp(16px,3vw,32px);
  min-height:100vh;display:flex;flex-direction:column;
}
.frame{
  flex:1;display:flex;flex-direction:column;
  background:var(--paper);
  border:2.5px solid var(--lime);border-radius:32px;
  padding:clamp(18px,3.2vw,38px);
  box-shadow:0 12px 40px rgba(0,0,0,0.04);
}
#app{
  flex:1;
  display:flex;
  flex-direction:column;
}
.top{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:clamp(16px,2.6vw,26px);user-select:none;
}
.brand{
  display:flex;align-items:center;gap:12px;
  font-family:var(--font-display);font-weight:800;font-size:clamp(18px,2.1vw,21px);
  font-variation-settings: 'wdth' 110, 'wght' 800; /* YFF Rare Power Bold (Заголовки) */
  letter-spacing:-0.02em;cursor:pointer;
}
.brand svg{width:26px;height:26px;flex:none;color:var(--text)}
.top-actions{display:flex;align-items:center;gap:10px}
.pill{
  background:var(--bar);color:var(--on-bar);border:1.5px solid rgba(255,255,255,0.08);
  font-family:var(--font-display);font-weight:700;font-size:13px;padding:5px 14px 5px 6px;border-radius:999px;
  font-variation-settings: 'wdth' 100, 'wght' 700; /* YFF Rare Mega Bold (Подзаголовки) */
  display:inline-flex;align-items:center;gap:8px;
  white-space:nowrap;user-select:none;
}
.badge-ekom{
  background:var(--lime);color:var(--on-lime);font-family:var(--font-display);font-weight:800;font-size:11.5px;
  font-variation-settings: 'wdth' 100, 'wght' 800; /* YFF Rare Mega Bold */
  padding:3px 10px;border-radius:999px;letter-spacing:0.04em;
}
.icon-btn{
  background:none;border:0;padding:8px;border-radius:12px;
  cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;
}
.icon-btn:hover{color:var(--text);background:var(--panel)}
.tick{
  display:inline-block;width:9px;height:9px;
  background:var(--red);border-radius:50%;flex:none;
}
.screen{flex:1;display:flex;flex-direction:column;animation:enter .18s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}}
.sr-heading:focus{outline:none}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:64px;padding:16px 36px;border-radius:999px;border:0;cursor:pointer;
  font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-0.01em;
  font-variation-settings: 'wdth' 100, 'wght' 700; /* YFF Rare Mega Bold */
  background:var(--bar);color:var(--on-bar);
  transition:transform .12s ease, opacity .15s ease, background-color .15s ease, box-shadow .15s ease;
  user-select:none;-webkit-user-select:none;
}
.btn:active{transform:scale(0.98)}
.btn-lime{
  background:var(--lime);color:var(--on-lime);font-weight:800;
  box-shadow:0 4px 18px rgba(166,237,0,0.32);
}
.btn-lime:hover{background:var(--lime-hover);box-shadow:0 6px 24px rgba(166,237,0,0.42)}
.btn[disabled]{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn-ghost{
  background:none;border:0;min-height:56px;padding:14px 18px;
  font-weight:600;font-size:18px;color:var(--muted);cursor:pointer;
}
.btn-ghost:hover{color:var(--text)}
.btn-small{min-height:46px;padding:10px 22px;font-size:15px;border-radius:999px}
.btn-outline{background:none;border:2px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--panel)}

/* Start / Hero */
.hero{
  flex:1;display:flex;flex-direction:column;justify-content:space-between;
  background:var(--lime);color:var(--on-lime);
  border-radius:28px;overflow:hidden;position:relative;
  min-height:clamp(440px, 60vh, 720px);
}
.hero-body{
  flex:1;padding:clamp(28px,4.5vw,56px);
  display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,2.5vw,32px);
  position:relative;z-index:1;
}
.hero h1{
  margin:0;font-family:var(--font-display);font-size:clamp(32px,4.8vw,64px);line-height:1.06;
  font-weight:800;letter-spacing:-0.03em;max-width:18ch;
  font-variation-settings: 'wdth' 110, 'wght' 800; /* Брендбук: YFF Rare Power Bold (Заголовки) */
}
.hero-facts{
  list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;
  gap:12px 24px;font-size:clamp(16px,1.9vw,19px);font-weight:700;
}
.hero-facts li{display:flex;align-items:center;gap:10px;font-variation-settings: 'wdth' 87, 'wght' 700;}
.hero-tag{
  display:inline-flex;align-items:center;background:var(--bar);color:var(--on-bar);
  font-family:var(--font-display);font-weight:700;font-size:12px;padding:6px 14px;border-radius:999px;
  font-variation-settings: 'wdth' 100, 'wght' 700; /* YFF Rare Mega Bold */
  letter-spacing:0.04em;align-self:flex-start;margin-bottom:-6px;
}
.hero-shape{
  position:absolute;right:-8%;top:-12%;width:min(58%,520px);
  aspect-ratio:1;z-index:0;pointer-events:none;
}
.hero-bar{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  background:var(--bar);color:var(--on-bar);
  margin:0 clamp(14px,2.2vw,24px) clamp(16px,2.4vw,28px);
  border-radius:999px;padding:12px 12px 12px clamp(20px,3vw,32px);
}
.hero-bar p{margin:0;font-size:clamp(16px,1.8vw,18px);font-weight:500;max-width:54ch}
@media (max-width:740px){
  .hero-bar{border-radius:24px;padding:20px}
  .hero-bar .btn{width:100%}
}

/* Question Screen */
.progress{
  display:flex;align-items:center;gap:18px;
  background:var(--bar);color:var(--on-bar);
  border-radius:999px;padding:12px 24px;
}
.progress-label{
  font-family:var(--font-display);font-weight:700;font-size:14px;white-space:nowrap;letter-spacing:0.02em;
  font-variation-settings: 'wdth' 100, 'wght' 700; /* YFF Rare Mega Bold */
}
.progress-track{flex:1;display:flex;gap:6px}
.progress-track span{
  flex:1;height:8px;border-radius:99px;
  background:rgba(255,255,255,.2);
}
.progress-track span.on{background:var(--lime)}
.qtitle{
  margin:clamp(20px,3.2vw,36px) 0 8px;
  font-family:var(--font-display);
  font-size:clamp(24px,3.4vw,38px);line-height:1.15;
  font-weight:800;letter-spacing:-0.02em;max-width:28ch;
  font-variation-settings: 'wdth' 110, 'wght' 800; /* Брендбук: YFF Rare Power Bold (Заголовки) */
}
.qhint{
  margin:0;color:var(--muted);font-size:clamp(16px,1.9vw,18px);
  font-family:var(--font-body);
  font-variation-settings: 'wdth' 87, 'wght' 400; /* Брендбук: YFF Rare Hyper Regular (Наборный текст) */
}
.options{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;margin-top:clamp(18px,2.6vw,28px);
}
.opt{
  display:flex;align-items:center;gap:16px;text-align:left;
  min-height:76px;padding:18px 24px;border-radius:22px;
  background:var(--panel);border:2px solid transparent;cursor:pointer;
  font-family:var(--font-body);
  font-variation-settings: 'wdth' 87, 'wght' 500; /* Брендбук: YFF Rare Hyper Regular (Наборный текст) */
  font-size:clamp(16.5px,1.9vw,18.5px);font-weight:600;line-height:1.3;
  transition:background-color .15s ease, transform .1s ease, border-color .15s ease, box-shadow .15s ease;
  user-select:none;-webkit-user-select:none;
}
.opt:active{transform:scale(0.99)}
.opt:hover{background:var(--panel-hover)}
.opt[aria-pressed="true"]{
  background:var(--lime);color:var(--on-lime);
  border-color:rgba(0,0,0,0.06);
  box-shadow:0 4px 18px rgba(166,237,0,0.25);
  font-variation-settings: 'wdth' 87, 'wght' 700; /* YFF Rare Hyper Bold при выборе */
}
.opt[aria-pressed="true"] .tick{background:var(--on-lime)}
.opt[disabled]{opacity:.38;cursor:not-allowed}
.nav{
  margin-top:auto;padding-top:clamp(22px,3vw,34px);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}

/* Contacts Form */
.form{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px 22px;margin-top:clamp(18px,2.6vw,28px);
}
@media (max-width:720px){.form{grid-template-columns:1fr}}
.field label{
  display:block;font-weight:700;font-size:15px;margin-bottom:8px;
  font-variation-settings: 'wdth' 87, 'wght' 700; /* YFF Rare Hyper Bold */
}
.field label span{color:var(--muted);font-weight:500;font-variation-settings: "wdth" 87, "wght" 400;}
.field input{
  width:100%;min-height:56px;padding:14px 20px;border-radius:18px;
  border:2px solid var(--border);background:var(--field);color:var(--text);
  font-family:var(--font-body);
  font-variation-settings: 'wdth' 87, 'wght' 500; /* YFF Rare Hyper Regular */
  font-size:18px;font-weight:600;transition:border-color .15s ease;
}
.field input:focus{border-color:var(--bar);background:var(--paper)}
.err{
  color:var(--red);font-size:14px;font-weight:700;margin-top:6px;min-height:1px;
  font-variation-settings: 'wdth' 87, 'wght' 700;
}
.consent{
  grid-column:1/-1;display:flex;gap:14px;align-items:flex-start;
  background:var(--panel);border-radius:18px;padding:16px 20px;cursor:pointer;
  font-size:15px;line-height:1.45;user-select:none;
  font-family:var(--font-body);
  font-variation-settings: 'wdth' 87, 'wght' 400; /* YFF Rare Hyper Regular */
}
.consent input{width:26px;height:26px;margin:2px 0 0;flex:none;accent-color:var(--lime)}


/* Thank You Screen — унифицирован с остальными экранами под iPad */
.lottery-box{
  margin-top:clamp(18px, 2.6vw, 30px);
  background:var(--panel);
  border:2px solid rgba(166,237,0,0.4);
  border-radius:26px;
  padding:clamp(26px, 4vw, 44px) clamp(18px, 3.5vw, 36px);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:16px;
  box-shadow:0 8px 30px rgba(0,0,0,0.04);
}
.lottery-badge{
  background:var(--lime);
  color:var(--on-lime);
  font-family:var(--font-display);
  font-variation-settings:'wdth' 100,'wght' 800;
  font-size:12px;
  letter-spacing:0.04em;
  padding:4px 16px;
  border-radius:999px;
  text-transform:uppercase;
}
.lottery-title{
  margin:0;
  font-family:var(--font-display);
  font-size:clamp(22px, 3.2vw, 32px);
  line-height:1.2;
  font-weight:800;
  letter-spacing:-0.02em;
  color:var(--text);
  font-variation-settings:'wdth' 100,'wght' 800;
}
.lottery-form{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  width:100%;
  max-width:440px;
  margin-top:8px;
}
.lottery-input{
  width:100%;
  min-height:64px;
  padding:14px 24px;
  border-radius:999px;
  border:2px solid var(--border);
  background:var(--paper);
  color:var(--text);
  font-family:var(--font-display);
  font-variation-settings:'wdth' 100,'wght' 700;
  font-size:24px;
  text-align:center;
  letter-spacing:0.06em;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.lottery-input:focus{
  border-color:var(--lime);
  outline:none;
  box-shadow:0 0 0 3px rgba(166,237,0,0.25);
}
.lottery-btn{
  width:100%;
  min-height:64px;
  padding:16px 32px;
  font-size:17px;
  white-space:nowrap;
  border-radius:999px;
}
.lottery-status{min-height:28px;margin-top:2px}

/* Result Screen */
.result-head{
  align-self:center;background:var(--bar);color:var(--on-bar);
  font-family:var(--font-display);
  border-radius:999px;padding:12px 42px;margin:0;
  font-size:clamp(20px,2.5vw,26px);font-weight:800;letter-spacing:-0.015em;text-align:center;
  font-variation-settings: 'wdth' 110, 'wght' 800; /* Брендбук: YFF Rare Power Bold (Заголовки) */
}
.result-lead{
  text-align:center;color:var(--muted);margin:12px auto 0;max-width:50ch;font-size:18px;
  font-family:var(--font-body);
  font-variation-settings: 'wdth' 87, 'wght' 400; /* YFF Rare Hyper Regular */
}
.main-card{
  margin-top:clamp(18px,2.6vw,28px);
  background:var(--lime);color:var(--on-lime);border-radius:28px;
  padding:clamp(22px,3.4vw,38px);
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px 36px;
  box-shadow:0 8px 30px rgba(166,237,0,0.22);
}
@media (max-width:820px){.main-card{grid-template-columns:1fr}}
.main-card h3{
  margin:0;font-family:var(--font-display);
  font-size:clamp(28px,3.8vw,44px);line-height:1.06;font-weight:800;letter-spacing:-0.025em;
  font-variation-settings: 'wdth' 100, 'wght' 800; /* Брендбук: YFF Rare Mega Bold (Подзаголовки) */
}
.main-card .desc{
  margin:14px 0 0;font-size:18px;line-height:1.4;max-width:40ch;
  font-variation-settings: 'wdth' 87, 'wght' 400;
}
.budget-badge{
  display:inline-block;margin-top:18px;font-family:var(--font-display);font-weight:700;font-size:15px;
  font-variation-settings: 'wdth' 100, 'wght' 700; /* YFF Rare Mega Bold */
  background:rgba(27,27,33,0.08);padding:8px 16px;border-radius:12px;
}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;align-self:center}
.why li{display:flex;gap:12px;align-items:flex-start;font-size:17px;font-weight:600;line-height:1.35;font-variation-settings: "wdth" 87, "wght" 600;}
.why .tick{margin-top:7px}
.main-card .why{background:rgba(255,255,255,.65);border-radius:22px;padding:22px 24px}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.extra{border:2.5px solid var(--lime);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.extra h4{
  margin:0;font-family:var(--font-display);
  font-size:22px;font-weight:800;letter-spacing:-0.02em;line-height:1.15;
  font-variation-settings: 'wdth' 100, 'wght' 800; /* Брендбук: YFF Rare Mega Bold (Подзаголовки) */
}
.extra .desc{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.extra .why{background:var(--panel);border-radius:18px;padding:16px 20px;align-self:stretch}
.extra .why li{font-size:15.5px}
.extra .budget-badge{margin-top:auto;font-size:14px;align-self:flex-start}
.next-bar{
  margin-top:18px;background:var(--panel);border-radius:24px;padding:20px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
}
.next-bar p{margin:0;max-width:58ch;font-size:16.5px;line-height:1.4}
.next-bar .meta{font-size:14px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:12px}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
  font-size:13px;font-weight:700;
}
.status-pill.ok{background:#E2F7D1;color:#1F6E00}
.status-pill.offline{background:#FFF3CD;color:#856404}

/* Admin / Answers Panel */
.ans-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ans-top h1{
  margin:0;font-family:var(--font-display);
  font-size:clamp(24px,3.2vw,34px);font-weight:800;letter-spacing:-0.025em;
  font-variation-settings: 'wdth' 100, 'wght' 800; /* Mega Bold */
}
.ans-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:20px}
@media (max-width:800px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:540px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{
  border-radius:20px;padding:16px 18px;background:var(--panel);
  text-align:left;border:2px solid transparent;cursor:pointer;
  transition:all .15s ease;
}
.stat b{
  display:block;font-family:var(--font-display);
  font-size:30px;font-weight:800;line-height:1;letter-spacing:-0.02em;
  font-variation-settings: 'wdth' 100, 'wght' 800; /* Mega Bold */
}
.stat span{font-size:14.5px;font-weight:600;color:var(--muted)}
.stat[aria-pressed="true"]{background:var(--bar);color:var(--on-bar);border-color:var(--bar)}
.stat[aria-pressed="true"] span{color:rgba(255,255,255,0.7)}
.search-bar{margin-top:16px;display:flex;gap:10px}
.search-input{
  flex:1;min-height:50px;padding:10px 18px;border-radius:14px;
  border:2px solid var(--border);background:var(--field);font-size:16px;
}
.table-wrap{
  overflow-x:auto;margin-top:16px;border:2px solid var(--border);
  border-radius:20px;background:var(--paper);
}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:15px}
th,td{text-align:left;padding:14px 16px;vertical-align:middle;border-bottom:1px solid var(--panel)}
th{font-weight:700;background:var(--panel);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(0,0,0,0.015)}
td .small{color:var(--muted);font-size:13.5px;margin-top:2px}
.temp{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.temp-hot{background:var(--red);color:#fff}
.temp-warm{background:var(--lime);color:var(--on-lime)}
.temp-cold{background:var(--panel);color:var(--text);border:1px solid var(--border)}
.sync-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
.sync-tag.synced{background:#E2F7D1;color:#1F6E00}
.sync-tag.pending{background:#FFF3CD;color:#856404}
.empty{margin-top:18px;background:var(--panel);border-radius:20px;padding:36px;text-align:center;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:12px}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100;backdrop-filter:blur(3px);
}
.modal{
  background:var(--paper);border-radius:28px;max-width:680px;width:100%;
  max-height:90vh;overflow-y:auto;padding:clamp(22px,3vw,34px);
  border:2px solid var(--lime);box-shadow:0 20px 50px rgba(0,0,0,0.25);
}
.modal h2{margin:0 0 16px;font-size:26px;font-weight:800}
.modal-close{float:right;background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}
.settings-group{margin-bottom:18px}
.settings-group label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.settings-group input{
  width:100%;min-height:50px;padding:10px 16px;border-radius:12px;
  border:2px solid var(--border);background:var(--field);font-size:15px;
}
.settings-group .help{font-size:13px;color:var(--muted);margin-top:4px}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);background:var(--bar);color:var(--on-bar);
  padding:14px 28px;border-radius:999px;font-weight:700;font-size:16px;z-index:120;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:enter .2s ease-out;
}
</style>
</head>
<body>
<div class="shell">
  <div class="frame">
    <header class="top">
      <div class="brand" id="brandLogo" title="Нажмите 5 раз для панели лидов">

  var digits = String(val||"").replace(/\D/g,"");
  if(!digits) return "";
  var sub = "";

    sub = digits.slice(1, 11);

    sub = digits.slice(0, 10);
  }
  var res = "+7";
  if(sub.length > 0){
    res += " (" + sub.slice(0, 3);
  }
  if(sub.length >= 4){
    res += ") " + sub.slice(3, 6);
  } else if(sub.length === 3){
    res += ")";
  }
  if(sub.length >= 7){
    res += "-" + sub.slice(6, 8);
  }
  if(sub.length >= 9){

  }

  if(B >= 3 || ind === "beauty_fmcg" || ind === "pets" || ind === "home"){

  }

  // 6. Flocktory MARTECH
  if(hasSite && B >= 2){
    if(has(site,"conv")) add("martech", 4, "A/B-тесты и подсказки растят конверсию с имеющегося трафика");
    if(has(site,"repeat")) add("martech", 2, "Напоминания и механики вовлечения возвращают покупателей");
  }

  // 7. Flocktory PERFORMANCE
  if(hasSite && (B === 4 || T >= 3)){
    if(has(pains,"few_buyers")) add("perf", 3, "Новые покупатели через партнёрскую витрину подарков");
    add("perf", 2, "Дополнительный доход от монетизации трафика сайта");
  }

  // 8. Альфа-Реклама
  if(B >= 2 || a.team === "self" || has(plans,"ads")){
    var w = B >= 3 ? 0 : -1;
    if(has(pains,"few_buyers")) add("ads", 3+w, "Приведём покупателей из Яндекса, VK, Авито и Telegram");

    if(a.team === "self") add("ads", 2, "Запуск рекламы под ключ без лишней рутины");
    if(res.ads && (has(pains,"no_team") || B === 2)) add("ads", 2, "Поможем на старте и настроим всё под ключ");
  }

  // 9. Сервис «Подели» (BNPL)
  if(has(plans,"bnpl")) add("podeli", 4, "Покупатели платят долями, магазин получает 100% на следующий день");
  if(ind === "beauty_fmcg" || ind === "pets" || ind === "home") add("podeli", 1, "Увеличивает средний чек и выкуп в ритейле");

  // 10. РКО и эквайринг

  if(has(ch,"offline") && a.bank !== "rko_acq") add("rko", 3, "Торговый эквайринг 1% с бесплатной арендой терминалов");

  var ids = Object.keys(res).filter(function(k){ return res[k].score > 0; });
  ids.sort(function(x,y){ return (res[y].score - res[x].score) || (ORDER.indexOf(x) - ORDER.indexOf(y)); });

  var core = ids.filter(function(k){ return PRODUCTS[k].core; });
  var main = core[0];
  if(!main){
    main = hasSite ? "profi" : "start";

  }
  var rest = ids.filter(function(k){ return k !== main; }).slice(0, 2);
  return [main].concat(rest).map(function(k){ return {id:k, reasons:res[k].reasons.slice(0, 3)}; });
}

function temperature(a){
  var T = {t1:1, t2:2, t3:3, t4:4}[a.turnover] || 0;
  var B = {b1:1, b2:2, b3:3, b4:4}[a.budget] || 0;
  var plans = (a.plans || []).filter(function(x){ return x !== "nothing"; });
  if(onlyNone(a) || !a.channels) return "cold";
  if((T >= 3 || B >= 3) && plans.length > 0) return "hot";
  if(T >= 2 && plans.length >= 2) return "hot";
  return "warm";
}

/* ========================================================
   5. STORAGE & MULTI-DESTINATION DISPATCHER
   ======================================================== */
function getLeads(){
  try { return JSON.parse(localStorage.getItem(LEADS_KEY) || "[]") || []; } catch(e){ return []; }
}
function saveLeads(list){
  try { localStorage.setItem(LEADS_KEY, JSON.stringify(list)); } catch(e){}
}
function addLead(doc){
  var list = getLeads();
  list.unshift(doc);
  saveLeads(list);
}
function updateLead(doc){
  var list = getLeads();
  for(var i=0; i<list.length; i++){
    if(list[i].id === doc.id){
      list[i] = doc;
      break;
    }
  }
  saveLeads(list);
}
function updateLeadSync(id, status){
  var list = getLeads();
  for(var i=0; i<list.length; i++){
    if(list[i].id === id){ list[i].synced = status; break; }
  }
  saveLeads(list);
}

function sendToWebhook(url, doc){
  if(!url || !url.trim()) return Promise.resolve(false);
  return fetch(url.trim(), {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(doc),
    mode: "no-cors"
  }).then(function(){ return true; }).catch(function(){ return false; });
}

function dispatchLead(doc){
  var settings = getSettings();
  var promises = [];
  if(settings.googleScriptUrl){
    var gDoc = Object.assign({}, doc);
    if(gDoc.phone && gDoc.phone.charAt(0) === '+'){
      gDoc.phone = "'" + gDoc.phone;
    }
    promises.push(sendToWebhook(settings.googleScriptUrl, gDoc));
  }
  if(settings.yandexWebhookUrl){
    promises.push(sendToWebhook(settings.yandexWebhookUrl, doc));
  }

  if(promises.length === 0){
    // No remote webhooks set, lead safely stored locally
    return Promise.resolve("local_only");
  }

  return Promise.all(promises).then(function(results){
    var anySuccess = results.some(function(r){ return r === true; });
    updateLeadSync(doc.id, anySuccess);
    return anySuccess ? "sent" : "queued";
  }).catch(function(){
    updateLeadSync(doc.id, false);
    return "queued";
  });
}

function syncPendingLeads(){
  var leads = getLeads();
  var pending = leads.filter(function(l){ return !l.synced; });
  if(!pending.length) return Promise.resolve(0);
  var settings = getSettings();
  if(!settings.googleScriptUrl && !settings.yandexWebhookUrl){
    return Promise.resolve(0);
  }

  var count = 0;
  var chain = Promise.resolve();
  pending.forEach(function(doc){
    chain = chain.then(function(){
      return dispatchLead(doc).then(function(res){
        if(res === "sent") count++;
      });
    });
  });
  return chain.then(function(){ return count; });
}

      '</div>' +

  app.querySelectorAll(".opt").forEach(function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-v");
      if(q.type === "single"){
        state.answers[q.id] = v;
        app.querySelectorAll(".opt").forEach(function(optBtn){
          var isCur = optBtn.getAttribute("data-v") === v;
          optBtn.setAttribute("aria-pressed", isCur ? "true" : "false");
        });
        var nextBtn = document.getElementById("nextBtn");
        if(nextBtn) nextBtn.disabled = false;
        return;

      var cur = (state.answers[q.id] || []).slice();
      var ex = q.exclusive || [];
      if(cur.indexOf(v) !== -1){
        cur = cur.filter(function(x){ return x !== v; });
      } else if(ex.indexOf(v) !== -1){
        cur = [v];
      } else {
        cur = cur.filter(function(x){ return ex.indexOf(x) === -1; });
        if(q.max && cur.length >= q.max) return;
        cur.push(v);
      }
      state.answers[q.id] = cur;
      if(q.id === "channels"){
        if(!has(cur, "site")) delete state.answers.site;
        if(onlyNone(state.answers)) delete state.answers.turnover;
      }
      app.querySelectorAll(".opt").forEach(function(optBtn){
        var val = optBtn.getAttribute("data-v");
        var on = cur.indexOf(val) !== -1;
        var dis = !on && q.max && cur.length >= q.max;
        optBtn.setAttribute("aria-pressed", on ? "true" : "false");
        if(dis) optBtn.setAttribute("disabled", "");
        else optBtn.removeAttribute("disabled");
      });
      var nextBtn = document.getElementById("nextBtn");
      if(nextBtn) nextBtn.disabled = !isAnswered(q);
    };
  });

  document.getElementById("backBtn").onclick = function(){
    if(state.qi === 0) go("start");
    else { state.qi--; render(); }
  };
  document.getElementById("nextBtn").onclick = next;
}

function renderResult(){
  var name = state.contact.name.trim();
  var lead = state.lastLead || (getLeads()[0] || null);
  var currentLottery = lead && lead.lottery ? lead.lottery : (state.contact.lottery || "");
  var total = visibleQuestions().length;

  var allFilled = "";
  for(var i=0; i<total; i++) allFilled += '<span class="on"></span>';

  app.innerHTML =
    '<section class="screen">' +
      '<div class="progress" aria-label="Финальный шаг: Заявка принята">' +
        '<span class="progress-label">Заявка принята</span>' +

        (name ? esc(name) + ', мы ' : 'Мы ') + 'получили ваши ответы. Команда Альфа-Селлер свяжется с вами и подготовит персональное решение.' +

          '<button type="button" class="btn btn-lime lottery-btn" id="saveLotteryBtn">' +

          '</button>' +
        '</div>' +
        '<div id="lotteryStatus" class="lottery-status">' +
          (currentLottery ? '<span class="status-pill ok">✓ Номер ' + esc(currentLottery) + ' привязан к вашей заявке в таблице!</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="nav" style="margin-top:auto;">' +
        '<div id="saveMeta">' +
          (state.saveStatus === "sent" ? '<span class="status-pill ok">✓ Данные успешно отправлены</span>' :
           state.saveStatus ? '<span class="status-pill offline">💾 Сохранено на устройстве</span>' : '') +
        '</div>' +
        '<button type="button" class="btn btn-lime" id="againBtn">Заполнить заново</button>' +
      '</div>' +
    '</section>';

  document.getElementById("againBtn").onclick = function(){
    state = fresh();
    render();
  };

  // Привязка номера лотереи к заявке в Google Таблице
  var lBtn = document.getElementById("saveLotteryBtn");
  var lInput = document.getElementById("lotteryInput");
  var lStatus = document.getElementById("lotteryStatus");

  function saveLottery(){
    var val = lInput.value.trim();
    if(!val){
      lStatus.innerHTML = '<span class="status-pill offline">Пожалуйста, введите номер билета</span>';
      lInput.focus();
      return;
    }
    lBtn.disabled = true;
    lBtn.textContent = "Сохранение...";
    lStatus.innerHTML = '<span class="status-pill" style="background:var(--panel);color:var(--muted)">Отправка в таблицу...</span>';

    var curLead = state.lastLead || (getLeads()[0] || null);
    if(curLead){
      curLead.lottery = val;
      curLead.lotteryNumber = val;
      updateLead(curLead);
    }
    state.contact.lottery = val;

    var settings = getSettings();
    // Привязываем номер лотереи и передаём полную копию лида со всеми ответами,
    // чтобы даже при отсутствии исходной строки в таблице все данные сохранились полностью
    var payload = Object.assign({}, curLead || {}, {
      action: "updateLottery",
      id: curLead ? curLead.id : "",
      phone: curLead ? curLead.phone : (state.contact.phone || ""),
      name: curLead ? curLead.name : (state.contact.name || ""),
      lottery: val,
      lotteryNumber: val
    });

    var p = settings.googleScriptUrl ? sendToWebhook(settings.googleScriptUrl, payload) : Promise.resolve(true);

    p.then(function(){
      reachGoal("lottery_attached", { number: val });
      lBtn.disabled = false;
      lBtn.textContent = "✓ Сохранено";
      lStatus.innerHTML = '<span class="status-pill ok">✓ Номер ' + esc(val) + ' успешно привязан к вашей анкете в таблице!</span>';
    }).catch(function(){
      lBtn.disabled = false;
      lBtn.textContent = "Повторить";
      lStatus.innerHTML = '<span class="status-pill offline">💾 Сохранено на устройстве (офлайн)</span>';
    });
  }

  if(lBtn) lBtn.onclick = saveLottery;
  if(lInput){
    lInput.onkeydown = function(e){
      if(e.key === "Enter"){
        e.preventDefault();
        saveLottery();
      }
    };
  }

  clearInterval(countdownTimer);
}

var answersFilter = "all", answersQuery = "";

function renderAnswers(){

    counts[d.temperature] = (counts[d.temperature] || 0) + 1;
    if(!d.synced) counts.unsynced++;
  });

  var filtered = docs.filter(function(d){
    if(answersFilter === "hot" && d.temperature !== "hot") return false;
    if(answersFilter === "warm" && d.temperature !== "warm") return false;
    if(answersFilter === "cold" && d.temperature !== "cold") return false;
    if(answersFilter === "unsynced" && d.synced) return false;
    if(answersQuery){
      var q = answersQuery.toLowerCase();
      var hay = [d.name, d.phone, d.telegram, d.maxLogin, d.company, d.mainProduct, d.industry].join(" ").toLowerCase();

function exportCsv(rows){
  var head = [
    "Дата", "Имя", "Телефон", "Email", "Telegram / МАКС", "Компания", "Номер лотереи",
    "Сегмент", "Основной продукт", "Все рекомендации",
    "Индустрия", "Где продаёт", "Оборот", "Сайт", "Сдерживает рост", "Планы", "Бюджет", "Кто ведёт", "Клиент банка"
  ];
  function cell(v){
    v = String(v == null ? "" : v);
    return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  var lines = [head.map(cell).join(";")];
  rows.forEach(function(d){
    var t = d.answersText || {};
    lines.push([
      d.createdDate || "",
      d.name,
      d.phone,
      d.email || "",
      d.messenger || d.telegram || d.maxLogin || "",
      d.company || "",
      d.lottery || "",
      TEMP_LABEL[d.temperature] || "",
      d.mainProduct,
      (d.productNames || []).join(", "),
      d.industry || "",
      t.channels || "",
      t.turnover || "",
      t.site || "",
      t.pains || "",
      t.plans || "",
      t.budget || "",
      t.team || "",
      t.bank || ""
    ].map(cell).join(";"));
  });

  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = "alfaseller_leads_" + stamp + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast("Файл выгружен в Excel / CSV");
}
