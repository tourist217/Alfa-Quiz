<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Альфа Селлер">
<meta name="format-detection" content="telephone=no">
<title>Альфа Селлер — Подбор продуктов для бизнеса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F7F8FA;
  --paper:#FFFFFF;
  --panel:#F0F1F4;
  --panel-hover:#E6E8ED;
  --text:#0F1014;
  --muted:#5D5F6B;
  --bar:#111114;
  --on-bar:#FFFFFF;
  --lime:#B6F800;
  --lime-hover:#A2DF00;
  --on-lime:#000000;
  --red:#EF3124;
  --field:#F4F5F8;
  --border:#D8D9E0;
  --focus:#111114;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0A0B0E;
    --paper:#121318;
    --panel:#1C1D24;
    --panel-hover:#252730;
    --text:#F3F4F6;
    --muted:#9A9BA6;
    --bar:#000000;
    --on-bar:#FFFFFF;
    --field:#181920;
    --border:#2D2F3A;
    --focus:#B6F800;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--text);
  font-family:"Onest","Verdana","Arial",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:18px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.shell{
  max-width:1120px;margin:0 auto;
  padding:clamp(12px,2.4vw,24px) clamp(12px,2.6vw,28px) clamp(16px,3vw,32px);
  min-height:100vh;display:flex;flex-direction:column;
}
.frame{
  flex:1;display:flex;flex-direction:column;
  background:var(--paper);
  border:2.5px solid var(--lime);border-radius:32px;
  padding:clamp(18px,3.2vw,38px);
  box-shadow:0 12px 40px rgba(0,0,0,0.04);
}
#app{
  flex:1;
  display:flex;
  flex-direction:column;
}
.top{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:clamp(16px,2.6vw,26px);user-select:none;
}
.brand{
  display:flex;align-items:center;gap:12px;
  font-weight:800;font-size:clamp(19px,2.2vw,22px);
  letter-spacing:-0.02em;cursor:pointer;
}
.brand svg{width:26px;height:26px;flex:none;color:var(--text)}
.top-actions{display:flex;align-items:center;gap:10px}
.pill{
  background:var(--panel);color:var(--text);border:1.5px solid var(--border);
  font-weight:700;font-size:14px;padding:6px 14px 6px 8px;border-radius:999px;
  display:inline-flex;align-items:center;gap:8px;
  white-space:nowrap;user-select:none;
}
.badge-ekom{
  background:var(--lime);color:var(--on-lime);font-weight:800;font-size:12.5px;
  padding:3px 10px;border-radius:999px;letter-spacing:0.04em;
}
.icon-btn{
  background:none;border:0;padding:8px;border-radius:12px;
  cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;
}
.icon-btn:hover{color:var(--text);background:var(--panel)}
.tick{
  display:inline-block;width:9px;height:9px;
  background:var(--red);border-radius:50%;flex:none;
}
.screen{flex:1;display:flex;flex-direction:column;animation:enter .18s cubic-bezier(0.16, 1, 0.3, 1)}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}}
.sr-heading:focus{outline:none}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:64px;padding:16px 36px;border-radius:999px;border:0;cursor:pointer;
  font-weight:700;font-size:19px;
  background:var(--bar);color:var(--on-bar);
  transition:transform .12s ease, opacity .15s ease;
  user-select:none;-webkit-user-select:none;
}
.btn:active{transform:scale(0.98)}
.btn-lime{background:var(--lime);color:var(--on-lime)}
.btn-lime:hover{background:var(--lime-hover)}
.btn[disabled]{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn-ghost{
  background:none;border:0;min-height:56px;padding:14px 18px;
  font-weight:600;font-size:18px;color:var(--muted);cursor:pointer;
}
.btn-ghost:hover{color:var(--text)}
.btn-small{min-height:46px;padding:10px 22px;font-size:16px;border-radius:999px}
.btn-outline{background:none;border:2px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--panel)}

/* Start / Hero */
.hero{
  flex:1;display:flex;flex-direction:column;justify-content:space-between;
  background:var(--lime);color:var(--on-lime);
  border-radius:28px;overflow:hidden;position:relative;
  min-height:clamp(440px, 60vh, 720px);
}
.hero-body{
  flex:1;padding:clamp(28px,4.5vw,56px);
  display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,2.5vw,32px);
  position:relative;z-index:1;
}
.hero h1{
  margin:0;font-size:clamp(36px,5.4vw,70px);line-height:1.04;
  font-weight:800;letter-spacing:-0.035em;max-width:16ch;
}
.hero-facts{
  list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;
  gap:12px 24px;font-size: clamp(16px,1.9vw,20px);font-weight:700;
}
.hero-facts li{display:flex;align-items:center;gap:10px}
.hero-tag{
  display:inline-flex;align-items:center;background:var(--bar);color:var(--on-bar);
  font-weight:800;font-size:13px;padding:6px 16px;border-radius:999px;
  letter-spacing:0.04em;align-self:flex-start;margin-bottom:-6px;
}
.hero-shape{
  position:absolute;right:-8%;top:-12%;width:min(58%,520px);
  aspect-ratio:1;z-index:0;pointer-events:none;
}
.hero-bar{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  background:var(--bar);color:var(--on-bar);
  margin:0 clamp(14px,2.2vw,24px) clamp(16px,2.4vw,28px);
  border-radius:999px;padding:12px 12px 12px clamp(20px,3vw,32px);
}
.hero-bar p{margin:0;font-size:clamp(16px,1.8vw,18px);font-weight:500;max-width:54ch}
@media (max-width:740px){
  .hero-bar{border-radius:24px;padding:20px}
  .hero-bar .btn{width:100%}
}

/* Question Screen */
.progress{
  display:flex;align-items:center;gap:18px;
  background:var(--bar);color:var(--on-bar);
  border-radius:999px;padding:12px 24px;
}
.progress-label{font-weight:700;font-size:16px;white-space:nowrap}
.progress-track{flex:1;display:flex;gap:6px}
.progress-track span{
  flex:1;height:8px;border-radius:99px;
  background:rgba(255,255,255,.2);transform:skewX(-22deg);
}
.progress-track span.on{background:var(--lime)}
.qtitle{
  margin:clamp(20px,3.2vw,36px) 0 6px;
  font-size:clamp(26px,3.8vw,42px);line-height:1.12;
  font-weight:800;letter-spacing:-0.025em;max-width:24ch;
}
.qhint{margin:0;color:var(--muted);font-size:clamp(16px,1.9vw,18px)}
.options{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;margin-top:clamp(18px,2.6vw,28px);
}
.opt{
  display:flex;align-items:center;gap:16px;text-align:left;
  min-height:76px;padding:18px 24px;border-radius:22px;
  background:var(--panel);border:2px solid transparent;cursor:pointer;
  font-size:clamp(17px,2vw,19px);font-weight:600;line-height:1.3;
  transition:background-color .15s ease, transform .1s ease, border-color .15s ease;
  user-select:none;-webkit-user-select:none;
}
.opt:active{transform:scale(0.99)}
.opt:hover{background:var(--panel-hover)}
.opt[aria-pressed="true"]{
  background:var(--lime);color:var(--on-lime);
  border-color:rgba(0,0,0,0.08);
}
.opt[aria-pressed="true"] .tick{background:var(--on-lime)}
.opt[disabled]{opacity:.38;cursor:not-allowed}
.nav{
  margin-top:auto;padding-top:clamp(22px,3vw,34px);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}

/* Contacts Form */
.form{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px 22px;margin-top:clamp(18px,2.6vw,28px);
}
@media (max-width:720px){.form{grid-template-columns:1fr}}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.field label span{color:var(--muted);font-weight:500}
.field input{
  width:100%;min-height:62px;padding:14px 20px;border-radius:18px;
  border:2px solid var(--border);background:var(--field);
  font-size:18px;font-weight:600;transition:border-color .15s ease;
}
.field input:focus{border-color:var(--lime);outline:none;background:var(--paper)}
.field input[aria-invalid="true"]{border-color:var(--red)}
.err{color:var(--red);font-size:14px;font-weight:700;margin-top:6px;min-height:1px}
.consent{
  grid-column:1/-1;display:flex;gap:14px;align-items:flex-start;
  background:var(--panel);border-radius:18px;padding:16px 20px;cursor:pointer;
  font-size:15px;line-height:1.45;user-select:none;
}
.consent input{width:26px;height:26px;margin:2px 0 0;flex:none;accent-color:var(--lime)}

/* Result Screen */
.result-head{
  align-self:center;background:var(--bar);color:var(--on-bar);
  border-radius:999px;padding:12px 42px;margin:0;
  font-size:clamp(22px,2.8vw,28px);font-weight:800;letter-spacing:-0.015em;text-align:center;
}
.result-lead{text-align:center;color:var(--muted);margin:12px auto 0;max-width:50ch;font-size:18px}
.main-card{
  margin-top:clamp(18px,2.6vw,28px);
  background:var(--lime);color:var(--on-lime);border-radius:28px;
  padding:clamp(22px,3.4vw,38px);
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px 36px;
  box-shadow:0 8px 30px rgba(168,235,0,0.22);
}
@media (max-width:820px){.main-card{grid-template-columns:1fr}}
.main-card h3{margin:0;font-size:clamp(30px,4.2vw,46px);line-height:1.05;font-weight:800;letter-spacing:-0.03em}
.main-card .desc{margin:14px 0 0;font-size:18px;line-height:1.4;max-width:40ch}
.budget-badge{
  display:inline-block;margin-top:18px;font-weight:800;font-size:17px;
  background:rgba(27,27,33,0.08);padding:8px 16px;border-radius:12px;
}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;align-self:center}
.why li{display:flex;gap:12px;align-items:flex-start;font-size:17px;font-weight:600;line-height:1.35}
.why .tick{margin-top:5px}
.main-card .why{background:rgba(255,255,255,.62);border-radius:22px;padding:22px 24px}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.extra{border:2.5px solid var(--lime);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;background:var(--paper)}
.extra h4{margin:0;font-size:24px;font-weight:800;letter-spacing:-0.02em;line-height:1.15}
.extra .desc{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.extra .why{background:var(--panel);border-radius:18px;padding:16px 20px;align-self:stretch}
.extra .why li{font-size:15.5px}
.extra .budget-badge{margin-top:auto;font-size:15.5px;align-self:flex-start}
.next-bar{
  margin-top:18px;background:var(--panel);border-radius:24px;padding:20px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
}
.next-bar p{margin:0;max-width:58ch;font-size:16.5px;line-height:1.4}
.next-bar .meta{font-size:14px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:12px}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
  font-size:13px;font-weight:700;
}
.status-pill.ok{background:#E2F7D1;color:#1F6E00}
.status-pill.offline{background:#FFF3CD;color:#856404}

/* Admin / Answers Panel */
.ans-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ans-top h1{margin:0;font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-0.025em}
.ans-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:20px}
@media (max-width:800px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:540px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{
  border-radius:20px;padding:16px 18px;background:var(--panel);
  text-align:left;border:2px solid transparent;cursor:pointer;
  transition:all .15s ease;
}
.stat b{display:block;font-size:32px;font-weight:800;line-height:1;letter-spacing:-0.02em}
.stat span{font-size:14.5px;font-weight:600;color:var(--muted)}
.stat[aria-pressed="true"]{background:var(--bar);color:var(--on-bar);border-color:var(--bar)}
.stat[aria-pressed="true"] span{color:rgba(255,255,255,0.7)}
.search-bar{margin-top:16px;display:flex;gap:10px}
.search-input{
  flex:1;min-height:50px;padding:10px 18px;border-radius:14px;
  border:2px solid var(--border);background:var(--field);font-size:16px;
}
.table-wrap{
  overflow-x:auto;margin-top:16px;border:2px solid var(--border);
  border-radius:20px;background:var(--paper);
}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:15px}
th,td{text-align:left;padding:14px 16px;vertical-align:middle;border-bottom:1px solid var(--panel)}
th{font-weight:700;background:var(--panel);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(0,0,0,0.015)}
td .small{color:var(--muted);font-size:13.5px;margin-top:2px}
.temp{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.temp-hot{background:var(--red);color:#fff}
.temp-warm{background:var(--lime);color:var(--on-lime)}
.temp-cold{background:var(--panel);color:var(--text);border:1px solid var(--border)}
.sync-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
.sync-tag.synced{background:#E2F7D1;color:#1F6E00}
.sync-tag.pending{background:#FFF3CD;color:#856404}
.empty{margin-top:18px;background:var(--panel);border-radius:20px;padding:36px;text-align:center;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:12px}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100;backdrop-filter:blur(3px);
}
.modal{
  background:var(--paper);border-radius:28px;max-width:680px;width:100%;
  max-height:90vh;overflow-y:auto;padding:clamp(22px,3vw,34px);
  border:2px solid var(--lime);box-shadow:0 20px 50px rgba(0,0,0,0.25);
}
.modal h2{margin:0 0 16px;font-size:26px;font-weight:800}
.modal-close{float:right;background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted)}
.settings-group{margin-bottom:18px}
.settings-group label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.settings-group input{
  width:100%;min-height:50px;padding:10px 16px;border-radius:12px;
  border:2px solid var(--border);background:var(--field);font-size:15px;
}
.settings-group .help{font-size:13px;color:var(--muted);margin-top:4px}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);background:var(--bar);color:var(--on-bar);
  padding:14px 28px;border-radius:999px;font-weight:700;font-size:16px;z-index:120;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);animation:enter .2s ease-out;
}
</style>
</head>

  var d = String(v||"").replace(/\D/g,"");
  if(d.length === 10 && d[0] === "9") d = "7" + d;
  if(d.length === 11 && (d[0] === "8" || d[0] === "7")) d = "7" + d.slice(1);
  return d;
}
function formatPhone(val){
  var digits = String(val||"").replace(/\D/g,"");
  if(!digits) return "";
  var sub = "";
  if(digits[0] === "7" || digits[0] === "8"){
    sub = digits.slice(1, 11);
  } else {
    sub = digits.slice(0, 10);
  }
  var res = "+7";
  if(sub.length > 0){
    res += " (" + sub.slice(0, 3);
  }
  if(sub.length >= 4){
    res += ") " + sub.slice(3, 6);
  } else if(sub.length === 3){
    res += ")";
  }
  if(sub.length >= 7){
    res += "-" + sub.slice(6, 8);
  }
  if(sub.length >= 9){
    res += "-" + sub.slice(8, 10);
  }
  return res;
}

  // 7. Flocktory PERFORMANCE
  if(hasSite && (B === 4 || T >= 3)){
    if(has(pains,"few_buyers")) add("perf", 3, "Новые покупатели через партнёрскую витрину подарков");
    add("perf", 2, "Дополнительный доход от монетизации трафика сайта");

  // 8. Альфа-Реклама
  if(B >= 2 || a.team === "self" || has(plans,"ads")){

    if(has(pains,"few_buyers")) add("ads", 3+w, "Приведём покупателей из Яндекса, VK, Авито и Telegram");

    if(res.ads && (has(pains,"no_team") || B === 2)) add("ads", 2, "Поможем на старте и настроим всё под ключ");
  }

  var ids = Object.keys(res).filter(function(k){ return res[k].score > 0; });
  ids.sort(function(x,y){ return (res[y].score - res[x].score) || (ORDER.indexOf(x) - ORDER.indexOf(y)); });

  var core = ids.filter(function(k){ return PRODUCTS[k].core; });
  var main = core[0];
  if(!main){
    main = hasSite ? "profi" : "start";
    res[main] = {score:1, reasons:[hasSite ? "Интернет-магазин с интеграциями и мультиканальностью" : "Простой и быстрый запуск своего интернет-магазина"]};
  }
  var rest = ids.filter(function(k){ return k !== main; }).slice(0, 2);
  return [main].concat(rest).map(function(k){ return {id:k, reasons:res[k].reasons.slice(0, 3)}; });

function temperature(a){
  var T = {t1:1, t2:2, t3:3, t4:4}[a.turnover] || 0;
  var B = {b1:1, b2:2, b3:3, b4:4}[a.budget] || 0;
  var plans = (a.plans || []).filter(function(x){ return x !== "nothing"; });
  if(onlyNone(a) || !a.channels) return "cold";
  if((T >= 3 || B >= 3) && plans.length > 0) return "hot";
  if(T >= 2 && plans.length >= 2) return "hot";
  return "warm";
}

function getLeads(){
  try { return JSON.parse(localStorage.getItem(LEADS_KEY) || "[]") || []; } catch(e){ return []; }
}
function saveLeads(list){
  try { localStorage.setItem(LEADS_KEY, JSON.stringify(list)); } catch(e){}
}
function addLead(doc){
  var list = getLeads();
  list.unshift(doc);
  saveLeads(list);
}
function updateLeadSync(id, status){
  var list = getLeads();
  for(var i=0; i<list.length; i++){
    if(list[i].id === id){ list[i].synced = status; break; }
  }
  saveLeads(list);
}

function tgEsc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function sendToTelegram(settings, doc){
  if(!settings.telegramBotToken || !settings.telegramChatId) return Promise.resolve(false);
  var token = settings.telegramBotToken.trim();
  var chatId = settings.telegramChatId.trim();
  if(chatId && chatId.charAt(0) !== "@" && !/^-?\d+$/.test(chatId)){
    chatId = "@" + chatId;
  }
  
  var t = doc.answersText || {};
  var msgr = doc.messenger || doc.telegram || doc.maxLogin;
  var text = "🔥 <b>Новый лид с квиза Альфа Селлер!</b>\n\n" +
    "👤 <b>Имя:</b> " + tgEsc(doc.name) + "\n" +
    "📞 <b>Телефон:</b> <code>" + tgEsc(doc.phone) + "</code>\n" +
    (msgr ? "💬 <b>Telegram / МАКС:</b> <code>" + tgEsc(msgr) + "</code>\n" : "") +
    (doc.company ? "🏢 <b>Компания:</b> " + tgEsc(doc.company) + "\n" : "") +
    "\n🎯 <b>Сегмент:</b> " + (TEMP_LABEL[doc.temperature] || doc.leadType || "—") + "\n" +
    "⭐ <b>Рекомендация:</b> <b>" + tgEsc(doc.mainProduct || doc.primaryProduct) + "</b>\n" +
    "📦 <b>Все продукты:</b> " + tgEsc((doc.productNames || doc.recommendedProducts || []).join(", ")) + "\n\n" +
    "📊 <b>Параметры:</b>\n" +
    "• Отрасль: " + tgEsc(t.industry || doc.industry || "—") + "\n" +
    "• Где продаёт: " + tgEsc(t.channels || doc.channels || "—") + "\n" +
    "• Оборот: " + tgEsc(t.turnover || doc.turnover || "—") + "\n" +
    (t.site || doc.siteState ? "• Сайт: " + tgEsc(t.site || doc.siteState) + "\n" : "") +
    (t.pains || doc.pains ? "• Сдерживает рост: " + tgEsc(t.pains || doc.pains) + "\n" : "") +
    (t.plans || doc.plans ? "• Планы: " + tgEsc(t.plans || doc.plans) + "\n" : "") +
    "• Бюджет: " + tgEsc(t.budget || doc.budget || "—") + "\n" +
    (t.team || doc.team ? "• Кто ведёт: " + tgEsc(t.team || doc.team) + "\n" : "") +
    "• Клиент банка: " + tgEsc(t.bank || doc.bankClient || "—");

  return fetch("https://api.telegram.org/bot" + token + "/sendMessage", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      chat_id: chatId,
      text: text,
      parse_mode: "HTML"
    })
  }).then(function(r){ return r.ok; }).catch(function(){ return false; });
}

function sendToWebhook(url, doc){
  if(!url || !url.trim()) return Promise.resolve(false);
  return fetch(url.trim(), {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(doc),
    mode: "no-cors"
  }).then(function(){ return true; }).catch(function(){ return false; });
}

function dispatchLead(doc){
  var settings = getSettings();
  var promises = [];
  if(settings.telegramBotToken && settings.telegramChatId){
    promises.push(sendToTelegram(settings, doc));
  }
  if(settings.googleScriptUrl){
    var gDoc = Object.assign({}, doc);
    if(gDoc.phone && gDoc.phone.charAt(0) === '+'){
      gDoc.phone = "'" + gDoc.phone;
    }
    promises.push(sendToWebhook(settings.googleScriptUrl, gDoc));
  }
  if(settings.yandexWebhookUrl){
    promises.push(sendToWebhook(settings.yandexWebhookUrl, doc));
  }

  if(promises.length === 0){
    // No remote webhooks set, lead safely stored locally
    return Promise.resolve("local_only");
  }

  return Promise.all(promises).then(function(results){
    var anySuccess = results.some(function(r){ return r === true; });
    updateLeadSync(doc.id, anySuccess);
    return anySuccess ? "sent" : "queued";
  }).catch(function(){
    updateLeadSync(doc.id, false);
    return "queued";
  });
}

function syncPendingLeads(){
  var leads = getLeads();
  var pending = leads.filter(function(l){ return !l.synced; });
  if(!pending.length) return Promise.resolve(0);
  var settings = getSettings();
  if(!settings.googleScriptUrl && !settings.yandexWebhookUrl && !settings.telegramBotToken){
    return Promise.resolve(0);
  }

  var count = 0;
  var chain = Promise.resolve();
  pending.forEach(function(doc){
    chain = chain.then(function(){
      return dispatchLead(doc).then(function(res){
        if(res === "sent") count++;
      });
    });
  });
  return chain.then(function(){ return count; });
}

      '</div>' +

  app.querySelectorAll(".opt").forEach(function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-v");
      if(q.type === "single"){
        state.answers[q.id] = v;
        app.querySelectorAll(".opt").forEach(function(optBtn){
          var isCur = optBtn.getAttribute("data-v") === v;
          optBtn.setAttribute("aria-pressed", isCur ? "true" : "false");
        });
        var nextBtn = document.getElementById("nextBtn");
        if(nextBtn) nextBtn.disabled = false;
        return;
      }
      var cur = (state.answers[q.id] || []).slice();
      var ex = q.exclusive || [];
      if(cur.indexOf(v) !== -1){
        cur = cur.filter(function(x){ return x !== v; });
      } else if(ex.indexOf(v) !== -1){
        cur = [v];
      } else {
        cur = cur.filter(function(x){ return ex.indexOf(x) === -1; });
        if(q.max && cur.length >= q.max) return;
        cur.push(v);
      }
      state.answers[q.id] = cur;
      if(q.id === "channels"){
        if(!has(cur, "site")) delete state.answers.site;
        if(onlyNone(state.answers)) delete state.answers.turnover;
      }
      app.querySelectorAll(".opt").forEach(function(optBtn){
        var val = optBtn.getAttribute("data-v");
        var on = cur.indexOf(val) !== -1;
        var dis = !on && q.max && cur.length >= q.max;
        optBtn.setAttribute("aria-pressed", on ? "true" : "false");
        if(dis) optBtn.setAttribute("disabled", "");
        else optBtn.removeAttribute("disabled");
      });
      var nextBtn = document.getElementById("nextBtn");
      if(nextBtn) nextBtn.disabled = !isAnswered(q);
    };
  });

  document.getElementById("backBtn").onclick = function(){
    if(state.qi === 0) go("start");
    else { state.qi--; render(); }
  };
  document.getElementById("nextBtn").onclick = next;
}

function next(){
  var list = visibleQuestions();
  if(!isAnswered(list[state.qi])) return;
  if(state.qi + 1 >= list.length) go("contacts");
  else { state.qi++; render(); }
}

  var recs = recommend(a);
  var temp = temperature(a);

    id: newId(),

    },

  addLead(doc);

var answersFilter = "all", answersQuery = "";

function renderAnswers(){
  var docs = getLeads();
  var counts = {all: docs.length, hot: 0, warm: 0, cold: 0, unsynced: 0};
  docs.forEach(function(d){
    counts[d.temperature] = (counts[d.temperature] || 0) + 1;
    if(!d.synced) counts.unsynced++;
  });

  var filtered = docs.filter(function(d){
    if(answersFilter === "hot" && d.temperature !== "hot") return false;
    if(answersFilter === "warm" && d.temperature !== "warm") return false;
    if(answersFilter === "cold" && d.temperature !== "cold") return false;
    if(answersFilter === "unsynced" && d.synced) return false;
    if(answersQuery){
      var q = answersQuery.toLowerCase();
      var hay = [d.name, d.phone, d.telegram, d.maxLogin, d.company, d.mainProduct, d.industry].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    }
    return true;
  });

    ["all", "Всего лидов"],
    ["hot", "🔥 Горячие"],
    ["warm", "☀️ Тёплые"],

    ["unsynced", "⏳ Офлайн (" + counts.unsynced + ")"]

    var active = answersFilter === s[0];
    return '<button type="button" class="stat" data-f="' + s[0] + '" aria-pressed="' + active + '">' +
      '<b>' + (counts[s[0]] || 0) + '</b><span>' + s[1] + '</span></button>';
  }).join("");

  } else {
    tableBody = '<div class="table-wrap"><table><thead><tr>' +
      '<th>Время</th><th>Контакт</th><th>МАКС / TG</th><th>Статус</th><th>Рекомендация</th><th>Индустрия и оборот</th><th>Синхронизация</th><th>Действия</th>' +
    '</tr></thead><tbody>' +

        '<td><b>' + esc(d.name) + '</b><div class="small">' + esc(d.phone) + '</div>' + (d.company ? '<div class="small">' + esc(d.company) + '</div>' : '') + '</td>' +
        '<td>' + (d.maxLogin ? '<div>МАКС: <b>' + esc(d.maxLogin) + '</b></div>' : '') + (d.telegram ? '<div class="small">TG: ' + esc(d.telegram) + '</div>' : '') + '</td>' +

        '<td><b>' + esc(d.mainProduct) + '</b><div class="small">' + esc((d.productNames || []).slice(1).join(", ")) + '</div></td>' +

        '<td><span class="sync-tag ' + (d.synced ? "synced" : "pending") + '">' + (d.synced ? "✓ Отправлен" : "💾 На iPad") + '</span></td>' +
        '<td><button type="button" class="btn-small btn-outline view-lead-btn" data-id="' + d.id + '">Детали</button></td>' +
      '</tr>';
    }).join("") + '</tbody></table></div>';
  }

  app.innerHTML =
    '<section class="screen">' +
      '<div class="ans-top">' +
        '<h1 class="sr-heading" tabindex="-1" data-focus>База контактов с мероприятия</h1>' +
        '<div class="ans-actions">' +
          '<button type="button" class="btn btn-small btn-lime" id="csvBtn">📥 Скачать Excel / CSV</button>' +
          '<button type="button" class="btn btn-small btn-outline" id="syncBtn">🔄 Синхронизировать</button>' +
          '<button type="button" class="btn btn-small" id="toQuiz">Вернуться к анкете</button>' +
        '</div>' +
      '</div>' +
      '<div class="stats">' + statsHtml + '</div>' +
      '<div class="search-bar">' +
        '<input type="text" class="search-input" id="leadSearch" placeholder="Поиск по имени, телефону, МАКС, компании или продукту…" value="' + esc(answersQuery) + '">' +
      '</div>' +
      tableBody +
      '<p class="note">Горячие лиды: оборот от 5 млн ₽ или бюджет от 150 000 ₽ с активными планами. Приоритетный контакт менеджером стенда.</p>' +
    '</section>';

function exportCsv(rows){
  var head = [
    "Дата", "Имя", "Телефон", "Telegram / МАКС", "Компания",
    "Сегмент", "Основной продукт", "Все рекомендации",
    "Индустрия", "Где продаёт", "Оборот", "Сайт", "Сдерживает рост", "Планы", "Бюджет", "Кто ведёт", "Клиент банка"
  ];
  function cell(v){
    v = String(v == null ? "" : v);
    return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  var lines = [head.map(cell).join(";")];
  rows.forEach(function(d){
    var t = d.answersText || {};
    lines.push([
      d.createdDate || "",
      d.name,
      d.phone,
      d.messenger || d.telegram || d.maxLogin || "",
      d.company,
      TEMP_LABEL[d.temperature] || "",
      d.mainProduct,
      (d.productNames || []).join(", "),
      d.industry || "",
      t.channels || "",
      t.turnover || "",
      t.site || "",
      t.pains || "",
      t.plans || "",
      t.budget || "",
      t.team || "",
      t.bank || ""
    ].map(cell).join(";"));
  });

  var blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = "alfaseller_leads_" + stamp + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast("Файл выгружен в Excel / CSV");
}
